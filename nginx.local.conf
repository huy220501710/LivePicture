server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # =====================
    # Vue frontend
    # =====================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # =====================
    # SSE & VIDEO STREAM (PHẢI ĐẶT TRƯỚC /api/)
    # =====================
    location /api/sse/ {
        proxy_pass http://fastapi-container:8000/api/sse/;

        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # =====================
    # REST API
    # =====================
    location /api/ {
        proxy_pass http://fastapi-container:8000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # =====================
    # WebSocket
    # =====================
    location /ws/ {
        proxy_pass http://fastapi-container:8000/ws/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =====================
    # Favicon
    # =====================
    location /favicon.ico {
        proxy_pass http://fastapi-container:8000/api/favicon.ico;
    }
}
